name: release-helper

on: [workflow_dispatch]

jobs:
  release:
    runs-on: [self-hosted, linux]
    env:
      VAULT_ADDR: http://127.0.0.1:8200
    steps:
      - uses: actions/checkout@v4
      - name: Read a secret from Vault
        run: |
          vault version
          vault login -no-print "${{ secrets.LAB_VAULT_TOKEN }}"
          vault kv get -format=json secret/demo | jq -r '.data.data.api_url'
      - name: Download and unpack the previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          gh release download --pattern '*.zip' --dir prev || echo "no previous release"
          if ls prev/*.zip >/dev/null 2>&1; then unzip -o prev/*.zip -d prev/; fi
      - name: Call an API
        run: curl -fsS https://api.github.com/zen
