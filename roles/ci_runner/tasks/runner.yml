---
- name: Create dedicated runner group
  ansible.builtin.group:
    name: "{{ ci_runner_user }}"
    state: present
  become: true

- name: Create dedicated runner user
  ansible.builtin.user:
    name: "{{ ci_runner_user }}"
    group: "{{ ci_runner_user }}"
    home: "{{ ci_runner_dir }}"
    shell: /bin/bash
    system: true
  become: true

- name: Ensure runner directory exists
  ansible.builtin.file:
    path: "{{ ci_runner_dir }}"
    state: directory
    owner: "{{ ci_runner_user }}"
    group: "{{ ci_runner_user }}"
    mode: '0755'
  become: true

- name: Download GitHub Actions runner package
  ansible.builtin.get_url:
    url: "https://github.com/actions/runner/releases/download/v{{ ci_runner_version }}/actions-runner-linux-x64-{{ ci_runner_version }}.tar.gz"
    dest: "/tmp/actions-runner-linux-x64-{{ ci_runner_version }}.tar.gz"
    mode: '0644'
  become: true

- name: Extract runner package
  ansible.builtin.unarchive:
    src: "/tmp/actions-runner-linux-x64-{{ ci_runner_version }}.tar.gz"
    dest: "{{ ci_runner_dir }}"
    remote_src: true
    owner: "{{ ci_runner_user }}"
    group: "{{ ci_runner_user }}"
    creates: "{{ ci_runner_dir }}/config.sh"
  become: true

- name: Install runner dependencies
  ansible.builtin.command:
    cmd: "{{ ci_runner_dir }}/bin/installdependencies.sh"
  args:
    creates: /etc/systemd/system/actions.runner.*
  become: true

- name: Check if runner is already configured
  ansible.builtin.stat:
    path: "{{ ci_runner_dir }}/.runner"
  register: runner_configured
  become: true

- name: Configure runner registration
  ansible.builtin.shell: |
    runuser -u {{ ci_runner_user }} -- ./config.sh --unattended \
      --url "{{ ci_runner_url }}" \
      --token "{{ runner_token }}" \
      --name "{{ ansible_hostname }}-runner" \
      --labels "{{ ci_runner_labels }}" \
      --replace
  args:
    chdir: "{{ ci_runner_dir }}"
  when: not runner_configured.stat.exists
  become: true

- name: Install runner system service
  ansible.builtin.command:
    cmd: ./svc.sh install {{ ci_runner_user }}
    chdir: "{{ ci_runner_dir }}"
  args:
    creates: /etc/systemd/system/actions.runner.*
  become: true

- name: Start runner system service
  ansible.builtin.command:
    cmd: ./svc.sh start
    chdir: "{{ ci_runner_dir }}"
  become: true
  ignore_errors: true
