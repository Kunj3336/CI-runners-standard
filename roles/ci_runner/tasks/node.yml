---
- name: Download NodeSource setup script
  ansible.builtin.get_url:
    url: "https://deb.nodesource.com/setup_{{ ci_node_major }}.x"
    dest: /tmp/nodesource_setup.sh
    mode: '0755'
  become: true

- name: Run NodeSource setup script
  ansible.builtin.command: /tmp/nodesource_setup.sh
  args:
    creates: /etc/apt/sources.list.d/nodesource.sources
  become: true

- name: Install pinned Node.js
  ansible.builtin.apt:
    name: "nodejs={{ ci_node_version }}"
    state: present
    allow_downgrade: true
    update_cache: true
  become: true
